# 生产配置模板：复制到 jar 同目录 application.yml 并按实际环境修改
server:
  port: 48100

spring:
  application:
    name: maoyu-crm
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/maoyu_crm?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: CHANGE_ME   # 生产库密码
    driver-class-name: com.mysql.cj.jdbc
  redis:
    host: 127.0.0.1
    port: 6379
  jackson:
    date-format: yyyy-MM-dd HH:mm-spring
    time-zone: Asia/Shanghai

sa-token:
  token-name: Authorization
  timeout: 2592000
  token-style: uuid
  is-read-header: true
  is-read-cookie: false

logging.level.com.freecrm: info
file:
  upload-dir: ./uploads/customer
